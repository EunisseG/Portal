# =====================================================================
# Ajustes de PRODUCCIÓN sobre docker-compose.yml (servidor, no el local).
#
# Se combina con el archivo base. Para que TODOS los comandos `docker compose`
# del servidor lo usen sin escribir -f cada vez, pon en el .env de la raíz:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# Qué cambia respecto al local:
#  - mysql y redis NO se publican al exterior (solo los ve la red interna).
#  - nginx escucha solo en 127.0.0.1: el tráfico entra por el nginx del host
#    (HTTPS con Certbot), nunca directo al contenedor.
#  - mailpit (correo de pruebas) no arranca.
#  - MySQL limita su memoria (innodb_buffer_pool_size) para servidores chicos.
# =====================================================================

services:
  nginx:
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:80"
    restart: unless-stopped

  mysql:
    # Se repite el comando base y se añade el límite de memoria. Ajusta
    # MYSQL_BUFFER_POOL en el .env de la raíz (256M para 2 GB, 512M para 4 GB).
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  app:
    restart: unless-stopped

  mailpit:
    # Solo para pruebas de correo en desarrollo: no se levanta en el servidor.
    profiles: ["dev"]
    ports: !reset []
