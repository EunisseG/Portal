services:
  # -------------------------------------------------------------------
  # app: PHP 8.3-FPM + Composer + Node/npm. Aquí corre Laravel.
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: portal-wortev/app
    container_name: portal-wortev-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

  # -------------------------------------------------------------------
  # queue: worker que procesa la cola (notificaciones, jobs). Reusa la
  # imagen de la app. Se reinicia solo si falla.
  # -------------------------------------------------------------------
  queue:
    image: portal-wortev/app
    container_name: portal-wortev-queue
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

  # -------------------------------------------------------------------
  # scheduler: ejecuta el planificador de Laravel cada minuto (recordatorios
  # de vencimiento, tareas programadas). Reusa la imagen de la app.
  # -------------------------------------------------------------------
  scheduler:
    image: portal-wortev/app
    container_name: portal-wortev-scheduler
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal

  # -------------------------------------------------------------------
  # nginx: servidor web. Expone el sitio en http://localhost:${APP_PORT}
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: portal-wortev-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portal

  # -------------------------------------------------------------------
  # mysql: base de datos MySQL 8
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: portal-wortev-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-portal_wortev}
      MYSQL_USER: ${DB_USERNAME:-wortev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal

  # -------------------------------------------------------------------
  # redis: colas, caché y notificaciones (preparado para uso futuro)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: portal-wortev-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - portal

  # -------------------------------------------------------------------
  # mailpit: servidor SMTP de PRUEBA. Captura todos los correos salientes
  # sin enviarlos a internet. SMTP en 1025, interfaz web en http://localhost:8025
  # Sirve para probar el envío real mientras se configuran credenciales SMTP
  # definitivas desde el panel.
  # -------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: portal-wortev-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
