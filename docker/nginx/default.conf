server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Resolver DNS interno de Docker. Permite re-resolver la IP del contenedor
    # "app" en runtime, de modo que si se recrea (nueva IP) nginx reconecte sin
    # reiniciarse. 'valid=10s' refresca la caché cada 10 segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tamaño máximo de subida (ajustable más adelante)
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Reenvía las peticiones PHP al contenedor "app" (PHP-FPM) por el puerto 9000.
    # Usar una variable ($upstream) obliga a nginx a resolver el DNS en cada
    # petición (vía el resolver de arriba), evitando el 502 cuando "app" cambia
    # de IP al recrearse.
    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deniega acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
