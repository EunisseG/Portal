; Ajustes de PHP para desarrollo local del Portal WORTEV.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 120

; --- OPcache ---
; Acelera cada petición cacheando el bytecode PHP en memoria (evita recompilar).
; validate_timestamps=1 revalida los archivos modificados, de modo que en
; desarrollo tus cambios de código se reflejan sin reconstruir ni limpiar nada.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
